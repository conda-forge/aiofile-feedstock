{% set name = "aiofile" %}
{% set version = "3.12.0" %}
{% set python_min = "3.11" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/aiofile-{{ version }}.tar.gz
  sha256: 451ec755398f749b90333a16a3000194c53437c1f9cb2dc9b812d9317281dffc

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - hatchling
  run:
    - caio >=0.12.0,<0.13.dev0
    # Conda version of ~=0.9.0
    - python >={{ python_min }}

test:
  imports:
    - aiofile
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: http://github.com/mosquito/aiofile
  summary: Asynchronous file operations.
  license: Apache-2.0
  license_file: LICENCE.md

extra:
  recipe-maintainers:
    - BastianZim
