{% set name = "aiofile" %}
{% set version = "3.11.0" %}
{% set python_min = "3.8" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/aiofile-{{ version }}.tar.gz
  sha256: 7f164b85fb767ae7889707d964373ca1277c2aa75f544d564f8577b2c71b5130

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - poetry-core
  run:
    - caio >=0.9.0,<0.10.dev0
    # Conda version of ~=0.9.0
    - python >={{ python_min }}

test:
  imports:
    - aiofile
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: http://github.com/mosquito/aiofile
  summary: Asynchronous file operations.
  license: Apache-2.0
  license_file: LICENCE.md

extra:
  recipe-maintainers:
    - BastianZim
